<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Carmanac{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 64rem; margin: 2rem auto; padding: 0 1rem; }
  nav { color: #666; margin-bottom: 1.5rem; }
  table { border-collapse: collapse; }
  th, td { text-align: left; padding: 0.25rem 1.25rem 0.25rem 0; border-bottom: 1px solid #ddd; }
  dt { color: #666; }
  .sub { color: #666; }
  .null, .unaddressed { color: #999; }
  .companies { max-width: 42rem; margin: 2rem 0 0; padding: 0; list-style: none; }
  .company { display: grid; grid-template-columns: 6rem 1fr auto; gap: 1rem; align-items: center;
    min-height: 4rem; padding: 0.75rem 0; color: inherit; text-decoration: none;
    border-bottom: 1px solid #ddd; }
  .company:hover .company-name { text-decoration: underline; }
  .company-logo { display: flex; width: 6rem; height: 4rem; align-items: center;
    justify-content: center; }
  .company-logo img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .company-name { font-weight: 600; }
  .company-count { color: #666; font-variant-numeric: tabular-nums; }
  @media (max-width: 34rem) {
    .company { grid-template-columns: 5rem 1fr; }
    .company-logo { width: 5rem; }
    .company-count { grid-column: 2; }
  }
</style>
</head>
<body>
<nav>
  <a href="/">Carmanac</a>{% for label, href in crumbs %} /
  {% if href %}<a href="{{ href }}">{{ label }}</a>{% else %}{{ label }}{% endif %}{% endfor %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
