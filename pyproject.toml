[project]
name = "carmanac"
version = "0.1.0"
description = "Global Vehicle Database - every production passenger vehicle ever made, globally."
requires-python = ">=3.11"

dependencies = [
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pycountry>=24.6",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carmanac*"]

# ---------------------------------------------------------------------------
# ruff - lint + format, per docs/charter.md conventions
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated; they don't need our import hygiene rules.
"alembic/versions/*" = ["E501", "I001"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests talk to the docker Postgres (they build their own
# `carmanac_test` database; the dev `carmanac` database is never touched).
# `-m "not integration"` runs just the pure-function unit tests.
markers = [
    "integration: needs the local docker Postgres (creates its own test database)",
]
